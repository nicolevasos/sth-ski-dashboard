<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Overview Technique Map</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.umd.min.js"></script>
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{font-family:Inter,Arial,sans-serif;color:#173044}#map{position:absolute;inset:0}
.map-card{position:absolute;z-index:3;background:rgba(255,255,255,.95);border:1px solid rgba(20,60,85,.12);border-radius:12px;box-shadow:0 8px 24px rgba(20,60,85,.18);backdrop-filter:blur(6px)}
#controls{top:10px;right:10px;padding:10px 12px;display:grid;gap:8px;min-width:175px;font-size:12px;transition:padding .16s ease,min-width .16s ease;z-index:20}.maplibregl-ctrl-top-right{top:var(--overview-controls-offset,118px);right:0;transition:top .16s ease}.controls-header{display:flex;align-items:center;justify-content:space-between;gap:10px}.control-title{font-weight:800;color:#315f7b;margin-bottom:1px}.controls-toggle{width:28px;height:28px;min-height:28px;padding:0;border:0;border-radius:7px;background:transparent;color:#315f7b;display:flex;align-items:center;justify-content:center;cursor:pointer}.controls-toggle:hover{background:#edf5fa}.controls-toggle svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.controls-body{display:grid;gap:8px}.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:650}.toggle input{margin:0}#controls.is-collapsed{min-width:0;padding:6px}#controls.is-collapsed .control-title,#controls.is-collapsed .controls-body{display:none}#controls.is-collapsed .controls-header{justify-content:center}
#legend{left:12px;bottom:12px;padding:10px 12px;min-width:185px;font-size:12px}.legend-title{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;color:#65859a;margin-bottom:7px}.legend-row{display:flex;align-items:center;gap:8px;margin:5px 0}.line{width:24px;height:0;border-top:4px solid;border-radius:99px}.empty{color:#71899a;font-style:italic}
.map-3d-control button{font-size:11px;font-weight:850}.map-3d-control button.active{background:#e8f4fc;color:#12679e}
</style></head><body><div id="map"></div>
<div id="controls" class="map-card"><div class="controls-header"><div class="control-title">Map content</div><button id="controlsToggle" class="controls-toggle" type="button" aria-label="Collapse map layer controls" aria-expanded="true" title="Collapse layer controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3.5 8 12 13 20.5 8 12 3Z"></path><path d="m3.5 12.5 8.5 5 8.5-5"></path></svg></button></div><div class="controls-body"><label class="toggle"><input id="resortToggle" type="checkbox" checked> Ski resort data</label><label class="toggle"><input id="techniqueToggle" type="checkbox" checked> Technique</label></div></div>
<div id="legend" class="map-card"><div class="legend-title">Technique legend</div><div id="legendRows" class="empty">Waiting for trajectory data…</div></div>
<script>
maptilersdk.config.apiKey='XGMBkywGOCmPQIjVuE1X';
const nativeConsoleWarn=console.warn.bind(console);console.warn=(...args)=>{const message=args.map(value=>String(value)).join(' ');if(message.includes('same source for a hillshade layer and for 3D terrain'))return;nativeConsoleWarn(...args)};
const map=new maptilersdk.Map({container:'map',style:'019f138f-779e-78fa-9899-5db087d490b8',center:[12.77667,47.32727],zoom:12.3,pitch:35,bearing:-15});
const SOURCE='overview-technique-source',LAYER='overview-technique-layer';
const colors={'Carving':'#2e75aa','Drifted':'#f0a43b','Snowplow steered':'#8a5bb8','Snowplow':'#8a5bb8','Unknown':'#94a3b8'};
let resortLayerIds=[];let currentPoints=[];let lastDataSignature='';let updateTimer=null;let mapReady=false;
function val(p,keys,fb=null){for(const k of keys){const v=p?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return fb}
function normalizeTechnique(v){const s=String(v||'Unknown').trim();if(/carv/i.test(s))return'Carving';if(/drift/i.test(s))return'Drifted';if(/snow|plow/i.test(s))return'Snowplow steered';return s||'Unknown'}
function normalize(points){return (points||[]).filter(p=>{const lon=+p.lon,lat=+p.lat;return Number.isFinite(lon)&&Number.isFinite(lat)&&lon>=-180&&lon<=180&&lat>=-90&&lat<=90}).map((p,i)=>({type:'Feature',geometry:{type:'Point',coordinates:[+p.lon,+p.lat]},properties:{...p,__i:i,__run:String(val(p,['run_id','run','file_name','source_file'],'Run 1')),__time:String(val(p,['phone_time','timestamp','time'],'')),__technique:normalizeTechnique(val(p,['analytics_technique','technique','turn_type','movement_class'],'Unknown'))}}))}
function timeMs(p){const d=new Date(p.properties.__time);return Number.isNaN(d.getTime())?p.properties.__i:d.getTime()}
function dist(a,b){const r=Math.PI/180,R=6371008.8,dlat=(b[1]-a[1])*r,dlon=(b[0]-a[0])*r,x=Math.sin(dlat/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)))}
function segments(features){const groups=new Map();features.forEach(f=>{const k=f.properties.__run;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(f)});const out=[];groups.forEach(g=>{g.sort((a,b)=>timeMs(a)-timeMs(b));for(let i=1;i<g.length;i++){const a=g[i-1],b=g[i],d=dist(a.geometry.coordinates,b.geometry.coordinates);if(!(d>0&&d<500))continue;out.push({type:'Feature',geometry:{type:'LineString',coordinates:[a.geometry.coordinates,b.geometry.coordinates]},properties:{__technique:a.properties.__technique!=='Unknown'?a.properties.__technique:b.properties.__technique,__run:a.properties.__run,__start:a.properties.__time,__end:b.properties.__time}})}});return{type:'FeatureCollection',features:out}}
function expression(){const e=['match',['get','__technique']];Object.entries(colors).forEach(([k,v])=>e.push(k,v));e.push('#94a3b8');return e}
function discoverResortLayers(){const skip=new Set([LAYER]);return (map.getStyle()?.layers||[]).filter(l=>!skip.has(l.id)&&(()=>{const text=[l.id,l['source-layer'],l.filter?JSON.stringify(l.filter):''].join(' ').toLowerCase();return /(piste|ski|run|aerialway|lift|gondola|chairlift|cable_car|poi|peak|summit)/.test(text)})()).map(l=>l.id)}
function setResortVisible(on){resortLayerIds.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',on?'visible':'none')})}
function renderLegend(features){const vals=[...new Set(features.map(f=>f.properties.__technique))];document.getElementById('legendRows').innerHTML=vals.length?vals.map(v=>`<div class="legend-row"><span class="line" style="border-color:${colors[v]||'#94a3b8'}"></span><span>${v}</span></div>`).join(''):'<span class="empty">No technique classes available</span>'}
function dataSignature(points){const list=points||[];if(!list.length)return'0';const first=list[0]||{},last=list[list.length-1]||{};return [list.length,first.lon,first.lat,last.lon,last.lat,first.phone_time||first.timestamp||'',last.phone_time||last.timestamp||''].join('|')}
function applyUpdate(points,fit=true){if(!mapReady)return;const signature=dataSignature(points);const same=signature===lastDataSignature;lastDataSignature=signature;currentPoints=normalize(points);const data=segments(currentPoints);const source=map.getSource(SOURCE);if(source)source.setData(data);renderLegend(data.features);if(fit&&!same&&currentPoints.length){const b=new maptilersdk.LngLatBounds();currentPoints.forEach(f=>b.extend(f.geometry.coordinates));if(!b.isEmpty()){map.stop();map.fitBounds(b,{padding:55,duration:0})}}}
function update(points,fit=true){clearTimeout(updateTimer);updateTimer=setTimeout(()=>applyUpdate(points,fit),40)}
class ThreeD{onAdd(m){this.map=m;this.el=document.createElement('div');this.el.className='maplibregl-ctrl maplibregl-ctrl-group map-3d-control';this.btn=document.createElement('button');this.btn.type='button';this.btn.textContent='3D';this.btn.title='Toggle 3D terrain view';this.btn.onclick=()=>{const active=m.getPitch()>10;m.easeTo({pitch:active?0:58,bearing:active?0:-22,duration:700});setTimeout(()=>this.sync(),720)};this.el.appendChild(this.btn);this.sync();return this.el}sync(){this.btn?.classList.toggle('active',this.map.getPitch()>10)}onRemove(){this.el.remove()}}
map.on('load',()=>{mapReady=true;const terrain=map.getTerrain();if(terrain){const styleJSON=map.getStyle();const hillshadeLayer=styleJSON.layers.find(layer=>layer.type==='hillshade'&&layer.source===terrain.source);if(hillshadeLayer&&!map.getSource('overview-hillshade-dedicated')){const sourceDefinition=styleJSON.sources[terrain.source];if(sourceDefinition){map.addSource('overview-hillshade-dedicated',{...sourceDefinition});const layerIndex=styleJSON.layers.findIndex(layer=>layer.id===hillshadeLayer.id);const beforeId=styleJSON.layers[layerIndex+1]?.id;map.removeLayer(hillshadeLayer.id);map.addLayer({...hillshadeLayer,source:'overview-hillshade-dedicated'},beforeId)}}}resortLayerIds=discoverResortLayers();map.addSource(SOURCE,{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:LAYER,type:'line',source:SOURCE,layout:{'line-cap':'round','line-join':'round'},paint:{'line-width':['interpolate',['linear'],['zoom'],10,2,13,4.5,16,7],'line-color':expression(),'line-opacity':.92}});map.addControl(new ThreeD(),'top-right');map.dragRotate?.enable?.();map.touchZoomRotate?.enableRotation?.();map.touchPitch?.enable?.();const controlsPanel=document.getElementById('controls'),controlsToggle=document.getElementById('controlsToggle');const syncRightControlStack=()=>{requestAnimationFrame(()=>document.documentElement.style.setProperty('--overview-controls-offset',`${controlsPanel.offsetTop+controlsPanel.offsetHeight+8}px`))};controlsToggle.onclick=()=>{const collapsed=controlsPanel.classList.toggle('is-collapsed');controlsToggle.setAttribute('aria-expanded',String(!collapsed));controlsToggle.setAttribute('aria-label',collapsed?'Expand map layer controls':'Collapse map layer controls');controlsToggle.title=collapsed?'Expand layer controls':'Collapse layer controls';syncRightControlStack()};syncRightControlStack();window.addEventListener('resize',syncRightControlStack);document.getElementById('resortToggle').onchange=e=>setResortVisible(e.target.checked);document.getElementById('techniqueToggle').onchange=e=>map.setLayoutProperty(LAYER,'visibility',e.target.checked?'visible':'none');map.on('click',LAYER,e=>{const p=e.features?.[0]?.properties;if(!p)return;new maptilersdk.Popup().setLngLat(e.lngLat).setHTML(`<b>${p.__technique}</b><br>Run: ${p.__run}${p.__start?`<br>Start: ${p.__start}`:''}`).addTo(map)});map.on('mouseenter',LAYER,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',LAYER,()=>map.getCanvas().style.cursor='');window.parent.postMessage({type:'SKI_MAP_LAYERS_READY',scope:'overview'},'*')});
window.addEventListener('message',e=>{if(e.data?.type==='SKI_DASHBOARD_ANALYTICS_DATA')update(e.data.points,e.data.fit!==false)});
</script></body></html>
