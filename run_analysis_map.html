<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Run Analysis Map</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.umd.min.js"></script>
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.8.0/maptiler-sdk.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{font-family:Inter,Arial,sans-serif;color:#173044}#map{position:absolute;inset:0}
.map-card{position:absolute;z-index:20;background:rgba(255,255,255,.96);border:1px solid rgba(20,60,85,.12);border-radius:12px;box-shadow:0 8px 24px rgba(20,60,85,.18);backdrop-filter:blur(7px)}
#controls{top:10px;right:10px;padding:9px;min-width:190px;transition:.16s ease}.controls-header{display:flex;align-items:center;justify-content:space-between;gap:8px}.control-title{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;color:#52758c}.controls-toggle,.legend-toggle{width:28px;height:28px;padding:0;border:0;border-radius:7px;background:transparent;color:#315f7b;display:grid;place-items:center;cursor:pointer}.controls-toggle:hover,.legend-toggle:hover{background:#edf5fa}.controls-toggle svg,.legend-toggle svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.controls-body{display:grid;gap:9px;margin-top:8px}.mode-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mode{position:relative}.mode input{position:absolute;opacity:0;pointer-events:none}.mode span{display:block;text-align:center;padding:7px 8px;border:1px solid #d8e6ef;border-radius:9px;font-size:11px;font-weight:800;color:#54758b;cursor:pointer;background:#fff}.mode input:checked+span{background:#dceef9;border-color:#83bde0;color:#154e73}.resort{display:flex;align-items:center;gap:8px;padding-top:2px;border-top:1px solid #e4edf3;font-size:11px;font-weight:700;color:#53758b}.resort input{margin:0}#controls.is-collapsed{min-width:0;padding:6px}#controls.is-collapsed .control-title,#controls.is-collapsed .controls-body{display:none}#controls.is-collapsed .controls-header{justify-content:center}
.maplibregl-ctrl-top-right{top:var(--run-controls-offset,128px);right:0;transition:top .16s ease}.map-3d-control button{font-size:11px;font-weight:850}.map-3d-control button.active{background:#e8f4fc;color:#12679e}
#legend{left:12px;bottom:12px;padding:9px 10px;min-width:190px;font-size:11px}.legend-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.legend-title{font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;color:#65859a}.legend-body{margin-top:6px}.legend-row{display:flex;align-items:center;gap:8px;margin:5px 0}.swatch{width:25px;height:5px;border-radius:99px}.dot{width:11px;height:11px;border-radius:50%}.legend-note{color:#6f8798;line-height:1.35}.empty{color:#71899a;font-style:italic}#legend.is-collapsed{min-width:0;padding:6px}#legend.is-collapsed .legend-title,#legend.is-collapsed .legend-body{display:none}
</style></head><body><div id="map"></div>
<div id="controls" class="map-card"><div class="controls-header"><div class="control-title">Analysis layer</div><button id="controlsToggle" class="controls-toggle" type="button" aria-expanded="true" title="Collapse layer control"><svg viewBox="0 0 24 24"><path d="M12 3 3.5 8 12 13 20.5 8 12 3Z"></path><path d="m3.5 12.5 8.5 5 8.5-5"></path></svg></button></div><div class="controls-body"><div class="mode-list">
<label class="mode"><input type="radio" name="mode" value="technique" checked><span>Technique</span></label><label class="mode"><input type="radio" name="mode" value="speed"><span>Speed</span></label><label class="mode"><input type="radio" name="mode" value="falls"><span>Falls</span></label><label class="mode"><input type="radio" name="mode" value="edge"><span>Edge angle</span></label></div><label class="resort"><input id="resortToggle" type="checkbox" checked> Ski resort data</label></div></div>
<div id="legend" class="map-card"><div class="legend-head"><div class="legend-title" id="legendTitle">Technique</div><button id="legendToggle" class="legend-toggle" type="button" aria-expanded="true" title="Collapse legend"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button></div><div id="legendBody" class="legend-body empty">Waiting for trajectory data…</div></div>
<script>
maptilersdk.config.apiKey='XGMBkywGOCmPQIjVuE1X';
const nativeWarn=console.warn.bind(console);console.warn=(...args)=>{if(args.map(String).join(' ').includes('same source for a hillshade layer and for 3D terrain'))return;nativeWarn(...args)};
const map=new maptilersdk.Map({container:'map',style:'019f138f-779e-78fa-9899-5db087d490b8',center:[12.77667,47.32727],zoom:12.3,pitch:35,bearing:-15});
const SEG='run-analysis-segments',PTS='run-analysis-points',HOVER='run-analysis-hover';let ready=false,currentMode='technique',resortIds=[],lastSig='',timer=null,currentFeatures=[];let lastViewportSignature='';
const techColors={'Carving':'#2e75aa','Drifted':'#f0a43b','Snowplow steered':'#8a5bb8','Snowplow':'#8a5bb8','Parallel':'#55a868','Gliding':'#8c9aa5','Unknown':'#94a3b8'};
function first(p,keys,fb=null){for(const k of keys){const v=p?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return fb}
function bool(v){const s=String(v??'').toLowerCase();return v===true||v===1||['true','yes','fall','fallen','detected'].some(x=>s.includes(x))}
function technique(v){const s=String(v||'Unknown').trim();if(/carv/i.test(s))return'Carving';if(/drift/i.test(s))return'Drifted';if(/snow|plow/i.test(s))return'Snowplow steered';if(/parallel/i.test(s))return'Parallel';if(/glid/i.test(s))return'Gliding';return s||'Unknown'}
function normalize(points){return(points||[]).filter(p=>{const x=+p.lon,y=+p.lat;return Number.isFinite(x)&&Number.isFinite(y)&&x>=-180&&x<=180&&y>=-90&&y<=90}).map((p,i)=>{const speed=Number(first(p,['speed','velocity','speed_ms','speed_m_s'],0));const edge=Number(first(p,['effective_edging_angle','edge_angle','edgeAngle','edging','edge','analytics_edge_angle'],NaN));return{type:'Feature',geometry:{type:'Point',coordinates:[+p.lon,+p.lat]},properties:{...p,__i:i,__run:String(first(p,['run_id','run','source_file','file_name'],'Run 1')),__time:String(first(p,['phone_time','timestamp','datetime','time'],'')),__speed:Number.isFinite(speed)?speed:0,__edge:Number.isFinite(edge)?edge:null,__fall:bool(first(p,['fall_candidate','fall_detected','fall','falls','is_fall','event'],false)),__fallConfidence:Number(first(p,['fall_confidence'],0))||0,__fallStatus:String(first(p,['fall_status'],'none')),__fallSource:String(first(p,['fall_source'],'multi-signal heuristic')),__technique:technique(first(p,['analytics_technique','technique','skiing_technique','turn_technique','movement_class'],'Unknown'))}}})}
function tms(f){const n=new Date(f.properties.__time).getTime();return Number.isFinite(n)?n:f.properties.__i}function distance(a,b){const r=Math.PI/180,R=6371008.8,dy=(b[1]-a[1])*r,dx=(b[0]-a[0])*r,h=Math.sin(dy/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dx/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))}
function segments(fs){const g=new Map();fs.forEach(f=>{const k=f.properties.__run;if(!g.has(k))g.set(k,[]);g.get(k).push(f)});const out=[];g.forEach(a=>{a.sort((x,y)=>tms(x)-tms(y));for(let i=1;i<a.length;i++){const x=a[i-1],y=a[i],d=distance(x.geometry.coordinates,y.geometry.coordinates);if(!(d>0&&d<500))continue;const mean=(m,n)=>{const z=[Number(m),Number(n)].filter(Number.isFinite);return z.length?z.reduce((q,w)=>q+w,0)/z.length:null};out.push({type:'Feature',geometry:{type:'LineString',coordinates:[x.geometry.coordinates,y.geometry.coordinates]},properties:{__i:y.properties.__i,__run:x.properties.__run,__time:x.properties.__time,__speed:mean(x.properties.__speed,y.properties.__speed)||0,__edge:mean(x.properties.__edge,y.properties.__edge),__fall:x.properties.__fall||y.properties.__fall,__technique:x.properties.__technique!=='Unknown'?x.properties.__technique:y.properties.__technique}})}});return{type:'FeatureCollection',features:out}}
function techExpr(){const e=['match',['get','__technique']];Object.entries(techColors).forEach(([k,v])=>e.push(k,v));e.push('#94a3b8');return e}
function discoverResort(){const own=new Set(['analysis-context','analysis-technique','analysis-speed','analysis-edge','analysis-falls']);return(map.getStyle()?.layers||[]).filter(l=>!own.has(l.id)&&/(piste|ski|run|aerialway|lift|gondola|chairlift|cable_car|poi|peak|summit)/i.test([l.id,l['source-layer'],JSON.stringify(l.filter||'')].join(' '))).map(l=>l.id)}
function resort(on){resortIds.forEach(id=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',on?'visible':'none'))}
const configs={technique:{title:'Technique',rows:()=>Object.entries(techColors).filter(([k])=>currentFeatures.some(f=>f.properties.__technique===k)).map(([k,c])=>[c,k])},speed:{title:'Speed',rows:()=>[['#2c7bb6','0–11 km/h'],['#abd9e9','11–22 km/h'],['#ffffbf','22–32 km/h'],['#fdae61','32–47 km/h'],['#d7191c','47+ km/h']]},falls:{title:'Falls',rows:()=>[['#d7191c','Detected fall'],['#91a5b3','Trajectory context']]},edge:{title:'Edge angle',rows:()=>[['#2c7bb6','0–20°'],['#abd9e9','20–35°'],['#ffffbf','35–50°'],['#fdae61','50–65°'],['#d7191c','65°+']]}};
function renderLegend(){const c=configs[currentMode];document.getElementById('legendTitle').textContent=c.title+' legend';const rows=c.rows();document.getElementById('legendBody').innerHTML=rows.length?rows.map(([color,label])=>`<div class="legend-row"><span class="${currentMode==='falls'?'dot':'swatch'}" style="background:${color}"></span><span>${label}</span></div>`).join(''):'<span class="empty">No values available</span>'}
function setMode(mode){if(!configs[mode])mode='technique';currentMode=mode;['technique','speed','edge','falls'].forEach(x=>map.getLayer('analysis-'+x)&&map.setLayoutProperty('analysis-'+x,'visibility',x===mode?'visible':'none'));map.getLayer('analysis-context')&&map.setLayoutProperty('analysis-context','visibility',mode==='falls'?'visible':'none');document.querySelector(`input[name="mode"][value="${mode}"]`).checked=true;renderLegend()}
function signature(p){if(!p?.length)return'0';const a=p[0],b=p.at(-1);return[p.length,a.lon,a.lat,b.lon,b.lat,a.phone_time||'',b.phone_time||''].join('|')}

function emitViewport(){
  if(!ready) return;
  const b=map.getBounds();
  if(!b) return;
  const bounds={west:b.getWest(),south:b.getSouth(),east:b.getEast(),north:b.getNorth()};
  const sig=[bounds.west,bounds.south,bounds.east,bounds.north].map(v=>Number(v).toFixed(6)).join('|');
  if(sig===lastViewportSignature) return;
  lastViewportSignature=sig;
  window.parent.postMessage({type:'SKI_RUN_MAP_VIEWPORT',bounds},'*');
}
function setHoverPoint(point){
  const source=map.getSource(HOVER);
  if(!source) return;
  const lon=Number(point?.lon),lat=Number(point?.lat);
  const valid=Number.isFinite(lon)&&Number.isFinite(lat)&&lon>=-180&&lon<=180&&lat>=-90&&lat<=90;
  source.setData(valid?{type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:{}}]}:{type:'FeatureCollection',features:[]});
}
function emitFeatureHover(feature){
  const p=feature?.properties;
  if(!p) return;
  window.parent.postMessage({type:'SKI_RUN_MAP_HOVER',index:Number(p.__i),lon:feature.geometry?.type==='Point'?feature.geometry.coordinates?.[0]:null,lat:feature.geometry?.type==='Point'?feature.geometry.coordinates?.[1]:null,time:p.__time||''},'*');
}
function apply(points,fit=true){if(!ready)return;const sig=signature(points),same=sig===lastSig;lastSig=sig;currentFeatures=normalize(points);map.getSource(PTS)?.setData({type:'FeatureCollection',features:currentFeatures});map.getSource(SEG)?.setData(segments(currentFeatures));renderLegend();if(fit&&!same&&currentFeatures.length){const b=new maptilersdk.LngLatBounds();currentFeatures.forEach(f=>b.extend(f.geometry.coordinates));if(!b.isEmpty()){map.stop();map.fitBounds(b,{padding:48,duration:0})}}}
function update(points,fit=true){clearTimeout(timer);timer=setTimeout(()=>apply(points,fit),35)}
class ThreeD{onAdd(m){this.m=m;this.el=document.createElement('div');this.el.className='maplibregl-ctrl maplibregl-ctrl-group map-3d-control';this.b=document.createElement('button');this.b.type='button';this.b.textContent='3D';this.b.onclick=()=>{const on=m.getPitch()>10;m.easeTo({pitch:on?0:58,bearing:on?0:-22,duration:650});setTimeout(()=>this.sync(),680)};this.el.appendChild(this.b);this.sync();return this.el}sync(){this.b.classList.toggle('active',this.m.getPitch()>10)}onRemove(){this.el.remove()}}
map.on('load',()=>{ready=true;const terrain=map.getTerrain(),style=map.getStyle();if(terrain){const h=style.layers.find(l=>l.type==='hillshade'&&l.source===terrain.source),src=style.sources[terrain.source];if(h&&src&&!map.getSource('run-hillshade-dedicated')){map.addSource('run-hillshade-dedicated',{...src});const i=style.layers.findIndex(l=>l.id===h.id),before=style.layers[i+1]?.id;map.removeLayer(h.id);map.addLayer({...h,source:'run-hillshade-dedicated'},before)}}resortIds=discoverResort();map.addSource(SEG,{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addSource(PTS,{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addSource(HOVER,{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'analysis-context',type:'line',source:SEG,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-width':['interpolate',['linear'],['zoom'],10,1.5,13,3.5,16,6],'line-color':'#91a5b3','line-opacity':.5}});map.addLayer({id:'analysis-technique',type:'line',source:SEG,layout:{'line-cap':'round','line-join':'round'},paint:{'line-width':['interpolate',['linear'],['zoom'],10,2,13,4.5,16,7],'line-color':techExpr(),'line-opacity':.94}});map.addLayer({id:'analysis-speed',type:'line',source:SEG,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-width':['interpolate',['linear'],['zoom'],10,2,13,4.5,16,7],'line-color':['interpolate',['linear'],['get','__speed'],0,'#2c7bb6',3,'#abd9e9',6,'#ffffbf',9,'#fdae61',13,'#d7191c'],'line-opacity':.94}});map.addLayer({id:'analysis-edge',type:'line',source:SEG,layout:{visibility:'none','line-cap':'round','line-join':'round'},paint:{'line-width':['interpolate',['linear'],['zoom'],10,2,13,4.5,16,7],'line-color':['interpolate',['linear'],['coalesce',['get','__edge'],0],0,'#2c7bb6',20,'#abd9e9',35,'#ffffbf',50,'#fdae61',65,'#d7191c'],'line-opacity':.94}});map.addLayer({id:'analysis-falls',type:'circle',source:PTS,filter:['==',['get','__fall'],true],layout:{visibility:'none'},paint:{'circle-radius':['interpolate',['linear'],['zoom'],10,5,15,9],'circle-color':['case',['==',['get','__fallStatus'],'likely'],'#d7191c','#f59e0b'],'circle-stroke-color':'#fff','circle-stroke-width':2,'circle-opacity':.96}});map.addLayer({id:'analysis-hover',type:'circle',source:HOVER,paint:{'circle-radius':8,'circle-color':'#1677ff','circle-stroke-color':'#fff','circle-stroke-width':3,'circle-opacity':1}});map.addControl(new ThreeD(),'top-right');map.dragRotate?.enable?.();map.touchZoomRotate?.enableRotation?.();map.touchPitch?.enable?.();
const cp=document.getElementById('controls'),ct=document.getElementById('controlsToggle');const sync=()=>requestAnimationFrame(()=>document.documentElement.style.setProperty('--run-controls-offset',`${cp.offsetTop+cp.offsetHeight+8}px`));ct.onclick=()=>{const c=cp.classList.toggle('is-collapsed');ct.setAttribute('aria-expanded',String(!c));ct.title=c?'Expand layer control':'Collapse layer control';sync()};sync();window.addEventListener('resize',sync);document.querySelectorAll('input[name="mode"]').forEach(x=>x.onchange=()=>setMode(x.value));document.getElementById('resortToggle').onchange=e=>resort(e.target.checked);const lg=document.getElementById('legend'),lt=document.getElementById('legendToggle');lt.onclick=()=>{const c=lg.classList.toggle('is-collapsed');lt.setAttribute('aria-expanded',String(!c));lt.title=c?'Expand legend':'Collapse legend'};
['analysis-technique','analysis-speed','analysis-edge','analysis-falls'].forEach(id=>{map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',id,()=>map.getCanvas().style.cursor='');map.on('mousemove',id,e=>emitFeatureHover(e.features?.[0]));map.on('click',id,e=>{const p=e.features?.[0]?.properties;if(!p)return;const speed=(Number(p.__speed)*3.6).toFixed(1),edge=Number(p.__edge);new maptilersdk.Popup().setLngLat(e.lngLat).setHTML(`<b>${p.__technique||'Run segment'}</b><br>Run: ${p.__run||'—'}<br>Speed: ${speed} km/h${Number.isFinite(edge)?`<br>Edge angle: ${edge.toFixed(1)}°`:''}${p.__fall?`<br><b>${p.__fallStatus==='likely'?'Likely fall':'Possible fall'}</b><br>Confidence: ${(Number(p.__fallConfidence||0)*100).toFixed(0)}%<br>Source: ${p.__fallSource||'multi-signal heuristic'}`:''}`).addTo(map)})});
map.on('moveend',emitViewport);map.on('zoomend',emitViewport);map.on('idle',()=>{map.resize();emitViewport()});
const resizeObserver=new ResizeObserver(()=>{requestAnimationFrame(()=>{map.resize();emitViewport()})});resizeObserver.observe(document.documentElement);
map.getCanvas().addEventListener('mouseleave',()=>window.parent.postMessage({type:'SKI_RUN_MAP_HOVER_CLEAR'},'*'));
setMode('technique');window.parent.postMessage({type:'SKI_MAP_LAYERS_READY',scope:'run-analysis'},'*');setTimeout(emitViewport,0)});
window.addEventListener('message',e=>{if(e.data?.type==='SKI_DASHBOARD_ANALYTICS_DATA')update(e.data.points,e.data.fit!==false);if(e.data?.type==='SKI_MAP_SELECT_LAYER')setMode(e.data.mode);if(e.data?.type==='SKI_RUN_MAP_HOVER_POINT')setHoverPoint(e.data.point);if(e.data?.type==='SKI_RUN_MAP_HOVER_CLEAR')setHoverPoint(null);if(e.data?.type==='SKI_RUN_MAP_RESIZE'){map.resize();emitViewport()}});
</script></body></html>
